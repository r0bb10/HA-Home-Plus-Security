name: "Release"

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@main"

      - name: "Set packaged manifest version"
        shell: "bash"
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH; got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          manifest="${{ github.workspace }}/custom_components/home_plus_security/manifest.json"
          jq --arg version "$version" '.version = $version' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/home_plus_security"
          zip home_plus_security.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/custom_components/home_plus_security/home_plus_security.zip
          generate_release_notes: true
